name: MCP check

on:
  push:
    paths:
      - "mcp/**"
      - ".mcp.json"
      - ".github/workflows/mcp-check.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".mcp.json"
      - ".github/workflows/mcp-check.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP dependencies
        run: npm install --prefix mcp --no-audit --no-fund

      - name: Type-check MCP server
        run: npm run --prefix mcp check

      - name: Build MCP server
        run: npm run --prefix mcp build
